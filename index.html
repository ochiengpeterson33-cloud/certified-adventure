<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certified Adventures | Travel in Comfort and Style | Premium Kenya Road Trips & Tours</title>
    <link rel="icon" type="image/png" href="/src/assets/images/certified_logo_1785596043136.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#08121B] text-[#F4E8D2] font-['Inter',sans-serif] antialiased selection:bg-[#E67A3A] selection:text-white">
    <div id="root"></div>
    <script>
      // Seamlessly redirect subpath requests to HashRouter routes to ensure refreshes never 404 in iFrame or cloud environments
      (function() {
        var path = window.location.pathname;
        if (path && path !== '/' && !path.startsWith('/@') && !path.startsWith('/src') && !path.startsWith('/assets') && !path.includes('.')) {
          var targetHash = '#' + path + window.location.search;
          window.history.replaceState(null, '', '/' + targetHash);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
